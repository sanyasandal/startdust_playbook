<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | AstraZeneca</title>
<!--
  stardust prototype — derived from Figma "One AZ v3.2", board 13496:19404
  ("Page: Login & Registration"), page instance 13496:20061 → frame 13496:10760.
  Decoded locally from the .fig file (no Figma MCP, no figma-to-content skill).
  Chrome (header/footer) is shown for context only; the conversion reuses the
  project's existing az-header / az-footer blocks.
-->
<style>
@font-face { font-family: az-inter; src: url('inter-var-latin.woff2') format('woff2'); font-weight: 400 700; }
@font-face { font-family: az-slab; src: url('roboto-slab-var-latin.woff2') format('woff2'); font-weight: 400 500; }
:root {
  --ink: #3c4242; --brand: #830051; --accent: #d0006f; --accent-hover: #a80059;
  --line: #d8dada; --muted: #b2b4b4; --soft: #ebefee; --rule: #d8dfde;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; color: var(--ink); font: 16px/24px az-inter, Inter, system-ui, sans-serif; }
.chrome { display: flex; align-items: center; height: 92px; padding: 0 130px; border-bottom: 1px solid var(--soft); }
.chrome img { height: 40px; }
section.sign-in { position: relative; display: flex; min-height: 941px; padding: 73px max(80px, calc((100% - 1280px) / 2)) 72px; }
.sign-in .bg { position: absolute; inset: 0; overflow: hidden; }
.sign-in .bg img { display: block; width: 100%; height: 100%; object-fit: cover; }
.sign-in .card { position: relative; display: flex; flex-direction: column; align-self: flex-start; width: 550px; max-width: 100%; border-radius: 8px; background: #fff; }
.sign-in .panel { display: flex; flex-direction: column; gap: 40px; padding: 40px; }
.sign-in h1 { margin: 0; color: var(--brand); font: 400 36px/40px Lexia, az-slab, Georgia, serif; }
.sign-in form { display: flex; flex-direction: column; gap: 24px; }
.sign-in .field { display: flex; flex-direction: column; gap: 4px; }
.sign-in .field-top { display: flex; justify-content: space-between; }
.sign-in label { font-weight: 700; }
.sign-in label::after { content: '*'; margin-left: 2px; color: var(--accent); font-weight: 400; }
.sign-in .field-top a, .sign-in .signup a { color: var(--accent); text-decoration: none; }
.sign-in input[type='email'], .sign-in input[type='password'] { width: 100%; height: 54px; padding: 0 16px; border: 1px solid var(--line); border-radius: 4px; font: inherit; }
/* eye reveal */ .sign-in .control { position: relative; } .sign-in .reveal { position: absolute; top: 17px; right: 16px; }
.sign-in input::placeholder { color: var(--muted); }
.sign-in .primary { display: flex; align-items: center; justify-content: center; min-height: 42px; border: 1px solid var(--accent); border-radius: 4px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; text-decoration: none; }
.sign-in .remember { display: flex; align-items: center; align-self: center; gap: 12px; }
.sign-in .remember label { font-weight: 400; }
.sign-in .remember label::after { content: none; }
.sign-in .remember input { width: 20px; height: 20px; margin: 0; }
.sign-in .divider { display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 700; }
.sign-in .divider::before, .sign-in .divider::after { content: ''; flex: 1; height: 1px; background: var(--rule); }
.sign-in .alternatives { display: flex; flex-direction: column; gap: 16px; }
.sign-in .alternatives a { display: flex; align-items: center; justify-content: center; min-height: 42px; border: 1px solid var(--accent); border-radius: 4px; color: var(--accent); font-weight: 700; text-decoration: none; }
.sign-in .signup { display: flex; justify-content: center; gap: 16px; margin: 0; padding: 24px; border-radius: 0 0 8px 8px; background: var(--soft); }
footer.chrome { height: 292px; border: 0; }
</style>
</head>
<body>
<header class="chrome" data-reuse="az-header"><img src="../../../icons/az-logo.svg" alt="AstraZeneca"></header>
<main>
  <section class="sign-in" data-screen-label="Login" data-ground="image">
    <div class="bg"><img src="bg.webp" alt=""></div>
    <div class="card">
      <div class="panel">
        <h1>Login to your account</h1>
        <form>
          <div class="field">
            <div class="field-top"><label for="email">Email</label></div>
            <input id="email" type="email" placeholder="john.dowry@example.com">
          </div>
          <div class="field">
            <div class="field-top"><label for="pw">Password</label><a href="#">Forgot your password?</a></div>
            <div class="control"><input id="pw" type="password" placeholder="*************"><img class="reveal" src="az-eye-open.svg" alt="" width="20" height="20"></div>
          </div>
          <a class="primary" href="#">Login</a>
          <div class="remember"><input id="rm" type="checkbox"><label for="rm">Remember me on this device</label></div>
        </form>
        <p class="divider">Or</p>
        <div class="alternatives">
          <a href="#">Login with Magic Link</a>
          <a href="#">Login using DocCheck</a>
          <a href="#">Login with AZ Employee Email</a>
        </div>
      </div>
      <p class="signup">Don't have an account? <a href="#">Create account</a></p>
    </div>
  </section>
</main>
<footer class="chrome" data-reuse="az-footer"></footer>
</body>
</html>
